<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Someone Special ❤️</title>

<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body>

<div class="container">
<div class="card">

<!-- STEP 1 -->
<div class="step active" id="step-1">
  <h2>Before Anything… 💌</h2>
  <p>What should I call you today?</p>
  <input type="text" id="herName" placeholder="Type your name here ❤️">
  <button id="continueBtn">Continue</button>
</div>

<!-- STEP 2 -->
<div class="step" id="step-2">
  <h2>Perfect Sarakki Lake Date? 🌊</h2>
  <div class="options">
    <button data-question="date" data-value="run">Morning Run 🏃</button>
    <button data-question="date" data-value="badminton">Badminton 🏸</button>
    <button data-question="date" data-value="walk">Peaceful Walk 🌅</button>
  </div>
</div>

<!-- STEP 3 -->
<div class="step" id="step-3">
  <h2>Dinner Plan? 🍽️</h2>
  <div class="options">
    <button data-question="food" data-value="mushroom">Mushroom Only 🍄</button>
    <button data-question="food" data-value="ghar">Simple Ghar Ka Khana 🏡</button>
    <button data-question="food" data-value="chocolate">Chocolate Date 🍫</button>
  </div>
</div>

<!-- STEP 4 -->
<div class="step" id="step-4">
  <h2>Evening Scene? 🎬</h2>
  <div class="options">
    <button data-question="evening" data-value="series">Watch Series Together 👀</button>
    <button data-question="evening" data-value="sing">You Sing 🎵</button>
    <button data-question="evening" data-value="deep">Deep Talks 🌌</button>
  </div>
</div>

<!-- STEP 5 -->
<div class="step" id="step-5">
  <h2 id="finalMessage"></h2>
  <p>You once said I never asked properly…</p>
  <h1>Will You Be My Valentine? 💘</h1>
  <button id="yesBtn">YES 💍</button>
  <button id="noBtn">No 🙈</button>
</div>

</div>
</div>

<script src="script.js"></script>
</body>
</html>
