<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Someone Special ❤️</title>

<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body>

<div class="container">
<div class="card">

<!-- STEP 1 -->
<div class="step active" id="step-1">
  <h2>Before Anything… 💌</h2>
  <p>What should I call you today?</p>
  <input type="text" id="herName" placeholder="Type your name here ❤️">
  <button id="continueBtn">Continue</button>
</div>

<!-- STEP 2 -->
<div class="step" id="step-2">
  <h2>When life feels heavy… what makes you feel calm? 🌿</h2>
  <div class="options">
    <button data-question="comfort" data-value="walk">
      Quiet walk near Sarakki Lake 🌅
    </button>
    <button data-question="comfort" data-value="sports">
      Running / Badminton to clear my head 🏃🏸
    </button>
    <button data-question="comfort" data-value="music">
      Singing or listening to music 🎵
    </button>
  </div>
</div>

<!-- STEP 3 -->
<div class="step" id="step-3">
  <h2>If someone truly understood you… what would they respect the most? 💭</h2>
  <div class="options">
    <button data-question="respect" data-value="simplicity">
      That I like life simple and peaceful 🌸
    </button>
    <button data-question="respect" data-value="goals">
      That I am serious about my goals (CAT, future etc.) 🎯
    </button>
    <button data-question="respect" data-value="faith">
      That I trust Bhagwaan and believe things happen for a reason 🛕
    </button>
  </div>
</div>

<!-- STEP 4 -->
<div class="step" id="step-4">
  <h2>Imagine February… how would you want it to feel? 💗</h2>
  <div class="options">
    <button data-question="vibe" data-value="soft">
      Simple. Peaceful. Safe. 🌷
    </button>
    <button data-question="vibe" data-value="fun">
      Light teasing, laughing, playful energy 😄
    </button>
    <button data-question="vibe" data-value="deep">
      Meaningful conversations under the sky 🌌
    </button>
  </div>
</div>


<!-- STEP 5 -->
<div class="step" id="step-5">
  <h2 id="finalMessage"></h2>
  <p>You once said I never asked properly…</p>
  <h1>Will You Be My Valentine? 💘</h1>
  <button id="yesBtn">YES 💍</button>
  <button id="noBtn">No 🙈</button>
</div>

</div>
</div>

<script src="script.js"></script>
</body>
</html>
